<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Bonik Bondhu">
  <!-- Bonik Bondhu mark: the bazaar's brass balance on the teal shop wall.
       Left pan: taka coins (the shop). Right pan: a rice sheaf (the farm). Beam level: money that fits. -->
  <rect x="9" y="9" width="60" height="60" rx="15" fill="#14201d"/>
  <rect x="3" y="3" width="60" height="60" rx="15" fill="#1e6f66" stroke="#14201d" stroke-width="3"/>
  <!-- post, foot, beam, pivot -->
  <rect x="31.5" y="17" width="3" height="33" fill="#e2b54f"/>
  <path d="M23 54 H43 L46 58 H20 Z" fill="#e2b54f" stroke="#8a6214" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="11" y="16" width="44" height="4.4" rx="2.2" fill="#e2b54f" stroke="#8a6214" stroke-width="1.2"/>
  <circle cx="33" cy="18.2" r="4" fill="#f6dc8e" stroke="#8a6214" stroke-width="1.4"/>
  <!-- strings -->
  <g stroke="#f6dc8e" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M17 20 L10.5 38 M17 20 L23.5 38 M49 20 L42.5 38 M49 20 L55.5 38"/>
  </g>
  <!-- left pan + taka coins -->
  <ellipse cx="17" cy="33.6" rx="6" ry="2.2" fill="#f6f8f5" stroke="#14201d" stroke-width="1.3"/>
  <ellipse cx="17" cy="30.6" rx="6" ry="2.2" fill="#f6f8f5" stroke="#14201d" stroke-width="1.3"/>
  <path d="M9 38 Q17 47 25 38 Z" fill="#e2b54f" stroke="#8a6214" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- right pan + rice sheaf -->
  <g stroke="#a6dc6e" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M49 37 Q48 32 45 27.5 M49 37 Q49.5 31 52.5 26.5 M49 37 V25.5"/>
  </g>
  <g fill="#a6dc6e">
    <ellipse cx="44.6" cy="27" rx="1.3" ry="2.2" transform="rotate(-30 44.6 27)"/>
    <ellipse cx="49" cy="24.6" rx="1.3" ry="2.2"/>
    <ellipse cx="53" cy="26" rx="1.3" ry="2.2" transform="rotate(30 53 26)"/>
  </g>
  <path d="M41 38 Q49 47 57 38 Z" fill="#e2b54f" stroke="#8a6214" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
