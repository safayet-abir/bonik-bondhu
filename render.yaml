# Render Blueprint (P7-T05, GAP-07 suggestion — see docs/06_Handoff/DEPLOY.md).
# One Docker web service; the database is Neon (free, does not expire). Secrets are entered in
# the Render dashboard (sync: false) and are never stored in this file.
services:
  - type: web
    name: bonik-bondhu
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL          # postgresql+psycopg://…neon.tech/…?sslmode=require
        sync: false
      - key: SECRET_SALT
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_FETCH_HOURS
        value: "24"
