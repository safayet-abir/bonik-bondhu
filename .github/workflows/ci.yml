# P0-T09: pytest (with PostgreSQL 16), i18n key parity, frontend build,
# secret scan of dist/ (TRD §12 "CI").
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bb
          POSTGRES_PASSWORD: bb
          POSTGRES_DB: bonik_bondhu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bb -d bonik_bondhu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      LLM_PROVIDER: none
      DATABASE_URL: postgresql+psycopg://bb:bb@localhost:5432/bonik_bondhu_test
      TEST_DATABASE_URL: postgresql+psycopg://bb:bb@localhost:5432/bonik_bondhu_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Schema copy matches the reviewed blueprint
        run: diff db/schema.sql ../docs/03_Technical/schema.sql && diff db/seed_demo.sql ../docs/03_Technical/seed_demo.sql
      - run: python -m pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run build
      - name: No secrets in dist/
        run: python3 ../scripts/check_dist_secrets.py dist
