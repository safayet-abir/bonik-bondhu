# Local PostgreSQL only (TRD §7). The app itself runs with uvicorn / vite.
# On machines without Docker, install PostgreSQL 16 natively and create the
# same role/database (see README.md "Local setup").
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: bb
      POSTGRES_DB: bonik_bondhu
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - bb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d bonik_bondhu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bb_pgdata:
